name: Deploy Core Services to GKE

on:
  push:
    branches: [ tp_integrador_2025 ]
    paths:
      - 'tpFinal/Pilar3/infra/**'

env:
  PROJECT_ID: blockchainsd2025
  CLUSTER_NAME: blockchain-cluster
  CLUSTER_ZONE: southamerica-east1-a
  GKE_NAMESPACE: default

jobs:
  deploy-core:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/catthehacker/ubuntu:full-latest

    steps:
      - name: Clonar el código
        uses: actions/checkout@v3
      - name: Autenticarse en Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configurar kubectl
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_ZONE }}

      - name: Desplegar Redis y RabbitMQ
        run: |
          kubectl apply -f tpFinal/Pilar3/infra/

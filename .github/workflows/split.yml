name: Deploy Split

on:
  push:
    paths:
      - 'tpFinal/split/**'
      - '.github/workflows/split.yml'
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: blockchainsd2025
      IMAGE_NAME: split
      IMAGE_TAG: latest
      CLUSTER_NAME: blockchain-cluster
      CLUSTER_ZONE: southamerica-east1-a

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}
          install_kubectl: false   # desactivamos este porque lo haremos con azure/setup-kubectl

      # <-- Aquí instalamos explícitamente kubectl -->
      - name: Install kubectl
        uses: azure/setup-kubectl@v3
        with:
          version: 'latest'

      # (Opcional) instala el plugin de auth para GKE
      - name: Install gke-gcloud-auth-plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet

      - name: Configure Docker to use gcloud for gcr.io only
        run: gcloud auth configure-docker gcr.io --quiet

      - name: Build and push Docker image
        run: |
          docker build \
            -t gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }} \
            ./split
          docker push \
            gcr.io/${{ env.PROJECT_ID }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

      - name: Get GKE credentials
        run: |
          gcloud container clusters get-credentials \
            ${{ env.CLUSTER_NAME }} \
            --zone ${{ env.CLUSTER_ZONE }}

      - name: Deploy to GKE
        run: kubectl apply -f Pilar3/infra/deployments/split.yaml

name: Deploy Frontend
on:
  push:
    paths:
      - 'tpFinal/tpFinal/pilar3-test-k8s/frontend/**'
      - '.github/workflows/06-frontend.yml'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout del repositorio
        uses: actions/checkout@v3
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: blockchainsd2025
      - name: Configure Docker to use gcloud for gcr.io
        run: gcloud auth configure-docker gcr.io --quiet

      - name: 🔐 Autenticación con GCP
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          cat Pilar3/infra/secrets/terraform-key.json > key.json
          gcloud auth activate-service-account --key-file=key.json
          gcloud config set project blockchainsd2025 --quiet
          gcloud auth configure-docker gcr.io --quiet

      - name: 🛠️ Build y Push Docker image Frontend
        run: |
          docker build \
            -t gcr.io/blockchainsd2025/frontend:latest \
            -f tpFinal/pilar3-test-k8s/frontend/Dockerfile \
            tpFinal/pilar3-test-k8s/frontend
          docker push gcr.io/blockchainsd2025/frontend:latest

      - name: ☸️ Despliegue en GKE del Frontend
        run: |
          gcloud container clusters get-credentials blockchain-cluster \
            --zone=southamerica-east1-a \
            --project=blockchainsd2025
          kubectl apply -f pilar3-test-k8s/08-frontend.yaml

apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: pool
  name: pool
  namespace: pilar3-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: pool
  template:
    metadata:
      labels:
        app: pool
    spec:
      containers:
      - env:
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: redis-secret
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              key: RABBITMQ_USER
              name: rabbitmq-secret
        - name: RABBITMQ_PASS
          valueFrom:
            secretKeyRef:
              key: RABBITMQ_PASS
              name: rabbitmq-secret
        envFrom:
        - configMapRef:
            name: blockchain-config
        - secretRef:
            name: blockchain-secrets
        - configMapRef:
            name: system-config
        image: gcr.io/blockchainsd2025/pool:latest
        name: pool
        ports:
        - containerPort: 9998
      nodeSelector:
        node-type: app
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: pool
  name: pool
  namespace: pilar3-test
spec:
  ports:
  - port: 9998
    targetPort: 9998
  selector:
    app: pool
  type: ClusterIP

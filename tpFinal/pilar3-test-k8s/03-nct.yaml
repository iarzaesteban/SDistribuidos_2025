apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app: nct
  name: nct
  namespace: pilar3-test
spec:
  replicas: 2
  selector:
    matchLabels:
      app: nct
  template:
    metadata:
      labels:
        app: nct
    spec:
      containers:
      - envFrom:
        - configMapRef:
            name: blockchain-config
        - secretRef:
            name: blockchain-secrets
        - configMapRef:
            name: system-config
        image: gcr.io/blockchainsd2025/nct:latest
        name: nct
        ports:
        - containerPort: 8989
        readinessProbe:
          httpGet:
            path: /health
            port: 8989
          initialDelaySeconds: 5
          periodSeconds: 5
      nodeSelector:
        node-type: app
---
apiVersion: v1
kind: Service
metadata:
  labels:
    app: nct
  name: nct
  namespace: pilar3-test
spec:
  ports:
  - port: 8989
    targetPort: 8989
  selector:
    app: nct
  type: LoadBalancer

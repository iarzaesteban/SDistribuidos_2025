apiVersion: apps/v1
kind: Deployment
metadata:
  name: nct
  namespace: pilar3-test
  labels:
    app: nct
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nct
  template:
    metadata:
      labels:
        app: nct
    spec:
      containers:
        - name: nct
          image: gcr.io/blockchainsd2025/nct:latest
          ports:
            - containerPort: 8989
          envFrom:
            - configMapRef:
                name: blockchain-config
            - secretRef:
                name: blockchain-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: 8989
            initialDelaySeconds: 5
            periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: nct
  namespace: pilar3-test
  labels:
    app: nct
spec:
  type: LoadBalancer
  ports:
    - port: 8989
      targetPort: 8989
  selector:
    app: nct

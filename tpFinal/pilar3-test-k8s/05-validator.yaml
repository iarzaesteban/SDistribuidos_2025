apiVersion: apps/v1
kind: Deployment
metadata:
  name: validator
  namespace: pilar3-test
  labels:
    app: validator
spec:
  replicas: 2
  selector:
    matchLabels:
      app: validator
  template:
    metadata:
      labels:
        app: validator
    spec:
      containers:
        - name: validator
          image: gcr.io/blockchainsd2025/validator:latest
          envFrom:
            - configMapRef:
                name: blockchain-config
            - secretRef:
                name: blockchain-secrets

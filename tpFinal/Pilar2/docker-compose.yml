  worker-mock-1:
    build:
      context: ./worker_mock
      dockerfile: deploy/Dockerfile
    env_file:
      - .env
    environment:
      - WORKER_NAME=worker-mock-1
    depends_on:
      nct:
        condition: service_healthy

  worker-real:
    build:
      context: ./worker-real
      dockerfile: Dockerfile
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - RABBITMQ_HOST=rabbitmq
      - REDIS_HOST=redis
      - WORKER_ID=worker-real
    depends_on:
      nct:
        condition: service_healthy
    volumes:
      - /etc/localtime:/etc/localtime:ro
    env_file:
      - .env


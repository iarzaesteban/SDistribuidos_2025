services:

  redis:
    image: redis:7.2-alpine
    container_name: redis
    ports:
      - "6379:6379"
    command: >
      redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}


  nct:
    build:
      context: ./coordinador
      dockerfile: deploy/Dockerfile
    container_name: nct
    ports:
      - "8989:8989"
    restart: unless-stopped
    volumes:
      - ./coordinador/app:/app/app
    depends_on:
      - redis
      - rabbitmq
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8989/health"]
      interval: 5s
      timeout: 3s
      retries: 10

  mover:
    build:
      context: ./exchanger
      dockerfile: deploy/Dockerfile
    depends_on:
      - rabbitmq
    env_file:
      - .env

  validator:
    build:
      context: ./validator
      dockerfile: deploy/Dockerfile
    depends_on:
      - redis
    env_file:
      - .env

  worker-mock:
    build:
      context: ./worker_mock
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    ports:
      - "8000:8000"
    depends_on:
      nct:
        condition: service_healthy
    env_file:
      - .env


apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-real
  labels:
    app: worker-real
spec:
  replicas: 1
  selector:
    matchLabels:
      app: worker-real
  template:
    metadata:
      labels:
        app: worker-real
    spec:
      containers:
      - name: worker-real
        image: gcr.io/blockchainsd2025/worker_real:latest
        env:
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: user
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: password
        volumeMounts:
        - name: gcp-sa-vol
          mountPath: /etc/gcp
          readOnly: true
      volumes:
      - name: gcp-sa-vol
        secret:
          secretName: gcp-sa-secret
          items:
          - key: key.json
            path: key.json

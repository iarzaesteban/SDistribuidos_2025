# worker-mock.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker-mock
  labels:
    app: worker-mock
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker-mock
  template:
    metadata:
      labels:
        app: worker-mock
    spec:
      containers:
      - name: worker-mock
        image: gcr.io/blockchainsd2025/worker_mock:latest
        env:
        - name: RABBITMQ_USER
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: rabbitmq-username
        - name: RABBITMQ_PASSWORD
          valueFrom:
            secretKeyRef:
              name: rabbitmq-secret
              key: rabbitmq-password
        livenessProbe:
          httpGet:
            path: /healthz
            port: 80
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            cpu: 200m
          limits:
            cpu: 500m
        volumeMounts:
        - name: gcp-sa-vol
          mountPath: /etc/gcp
          readOnly: true
      volumes:
      - name: gcp-sa-vol
        secret:
          secretName: gcp-sa-secret
          items:
          - key: key.json
            path: key.json

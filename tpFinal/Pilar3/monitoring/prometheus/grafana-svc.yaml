apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: monitoring
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: LoadBalancer
  ports:
    - port: 80         # puerto público
      targetPort: 3000 # puerto interno de Grafana
      protocol: TCP
  selector:
    app.kubernetes.io/name: grafana
